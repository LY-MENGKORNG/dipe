$kind: collection
description: |-
  Workshop demo API — "Data, Integration & Production Essentials".

  Run the folders in order: **auth** logs in and stores `admin_token` / `employee_token`,
  the other folders reuse them. Requests use the admin token by default (collection auth);
  requests that demonstrate 401/403 override it.

  Prerequisites: Postgres + Redis running, `bun run db:migrate:dev && bun run db:seed`, API on `base_url`.

$kind: http-example
request:
  url: "{{base_url}}/auth/login"
  method: POST
  headers:
    - key: "Content-Type"
      value: "application/json"
  body:
    type: json
    content: |-
      {
        "email": "{{admin_email}}",
        "password": "definitely-wrong"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "message": "Invalid credentials",
        "error": "Unauthorized",
        "statusCode": 401
      }

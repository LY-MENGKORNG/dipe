$kind: http-request
method: POST
url: "{{base_url}}/auth/login"
order: 1000
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{admin_email}}",
        "password": "{{admin_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("returns a bearer token", () => {
        pm.expect(body.tokenType).to.equal("Bearer");
        pm.expect(body.accessToken).to.be.a("string").and.not.empty;
      });
      pm.environment.set("admin_token", body.accessToken);
    language: text/javascript
examples: ./.resources/login as admin.resources/examples

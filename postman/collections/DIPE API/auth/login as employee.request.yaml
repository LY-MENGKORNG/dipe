$kind: http-request
method: POST
url: '{{base_url}}/auth/login'
order: 2000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{employee_email}}",
      "password": "{{employee_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      pm.environment.set("employee_token", pm.response.json().accessToken);

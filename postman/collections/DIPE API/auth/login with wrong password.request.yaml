$kind: http-request
method: POST
url: "{{base_url}}/auth/login"
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{admin_email}}",
      "password": "definitely-wrong"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("401 Unauthorized", () => pm.response.to.have.status(401));
      pm.test("does not reveal which part was wrong", () => {
        pm.expect(pm.response.json().message).to.equal("Invalid credentials");
      });
examples: "./.resources/login with wrong password.resources/examples"

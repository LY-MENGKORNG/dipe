$kind: http-request
method: POST
url: "{{base_url}}/tags"
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{tag_name}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("409 Conflict (unique tag name, Prisma P2002)", () => pm.response.to.have.status(409));

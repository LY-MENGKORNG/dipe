$kind: http-request
method: GET
url: '{{base_url}}/posts'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("has at least one post (run db:seed)", () => pm.expect(body).to.not.be.empty);
      pm.test("tags are flattened to { id, name }", () => body.forEach((p) => p.tags.forEach((t) => pm.expect(t).to.have.keys("id", "name"))));
      const [post] = body;
      pm.environment.set("post_id", String(post.id));
      pm.environment.set("post_tag_ids", JSON.stringify([...post.tags.map((t) => t.id), Number(pm.environment.get("tag_id"))]));

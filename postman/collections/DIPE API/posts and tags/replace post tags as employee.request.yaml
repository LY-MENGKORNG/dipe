$kind: http-request
method: PUT
url: '{{base_url}}/posts/:id/tags'
order: 6000
pathVariables:
  - key: id
    value: '{{post_id}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{employee_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "tagIds": []
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("403 Forbidden (RolesGuard)", () => pm.response.to.have.status(403));

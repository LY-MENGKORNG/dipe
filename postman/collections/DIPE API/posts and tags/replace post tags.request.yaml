$kind: http-request
method: PUT
url: "{{base_url}}/posts/:id/tags"
order: 5000
pathVariables:
  - key: id
    value: "{{post_id}}"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "tagIds": {{post_tag_ids}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      const ids = pm.response.json().tags.map((t) => t.id);
      pm.test("post now has exactly the requested tags", () => pm.expect(ids).to.have.members(JSON.parse(pm.environment.get("post_tag_ids"))));

$kind: http-request
method: POST
url: "{{base_url}}/projects/{{project_id}}/members"
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{employee_token}}"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "userId": {{admin_user_id}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("422 Unprocessable (not in workspace)", () => pm.response.to.have.status(422));

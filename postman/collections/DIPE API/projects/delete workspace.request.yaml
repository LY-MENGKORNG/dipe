$kind: http-request
method: DELETE
url: "{{base_url}}/workspaces/{{workspace_id}}"
order: 7000
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{employee_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

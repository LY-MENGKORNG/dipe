$kind: http-request
method: GET
url: "{{base_url}}/projects/{{project_id}}/members"
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{employee_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      pm.test("creator is LEAD", () => pm.expect(pm.response.json().data.find((m) => m.role === "LEAD")).to.exist);

$kind: http-example
request:
  url: "{{base_url}}/users"
  method: POST
  headers:
    - key: "Content-Type"
      value: "application/json"
  body:
    type: json
    content: |-
      {
        "name": "Demo User",
        "email": "{{user_email}}",
        "password": "Password1"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "id": 4,
        "name": "Demo User",
        "email": "demo-1760798982725@dipe.dev",
        "role": "employee",
        "isActive": true,
        "createdAt": "2026-10-18T14:29:42.725Z",
        "updatedAt": "2026-10-18T14:29:42.725Z"
      }

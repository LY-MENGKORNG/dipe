$kind: http-example
request:
  url: '{{base_url}}/users'
  method: POST
  headers:
    - key: 'Content-Type'
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "name": "Demo User",
        "email": "{{user_email}}",
        "password": "Password1"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "statusCode": 409,
        "message": "Resource already exists",
        "code": "P2002"
      }

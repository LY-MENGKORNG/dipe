$kind: http-request
method: POST
url: "{{base_url}}/users"
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Demo User",
      "email": "{{user_email}}",
      "password": "Password1"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.environment.set("user_email", `demo-${Date.now()}@dipe.dev`);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("201 Created", () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test("defaults to employee", () => pm.expect(body.role).to.equal("EMPLOYEE"));
      pm.test("never exposes the password hash", () => pm.expect(body).to.not.have.property("password_hash"));
      pm.environment.set("user_id", String(body.id));
examples: "./.resources/create user.resources/examples"

$kind: http-request
method: DELETE
url: '{{base_url}}/users/:id'
order: 10000
pathVariables:
  - key: id
    value: '{{user_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      pm.test("returns the deleted user", () => pm.expect(String(pm.response.json().id)).to.equal(pm.environment.get("user_id")));

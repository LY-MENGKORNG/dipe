$kind: http-request
method: POST
url: "{{base_url}}/workspaces/{{workspace_id}}/members"
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{employee_token}}"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "userId": {{staff_user_id}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("409 Conflict (P2002)", () => pm.response.to.have.status(409));

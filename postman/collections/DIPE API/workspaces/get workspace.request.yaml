$kind: http-request
method: GET
url: "{{base_url}}/workspaces/{{workspace_id}}"
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{employee_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      pm.test("is the created workspace", () => pm.expect(String(pm.response.json().id)).to.equal(pm.environment.get("workspace_id")));
